# Production on one server: web (app), queue worker, and an HTTPS proxy.
# Secrets live in .env on the server (copied from .env.production.example),
# never in git or in the image. Local development: docker-compose.dev.yml.
#
#   docker compose up -d --build
#
# One named volume ("data") holds the SQLite file (/data/database) and
# Laravel's storage (/data/storage); app and worker both mount it.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: study-companion:latest
  env_file: .env
  # Each service sets DB_CONNECTION, DB_DATABASE and APP_DATA itself (fixed by
  # this setup, so a wrong value in .env can't point elsewhere) plus its role.
  volumes:
    - data:/data
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database/database.sqlite
      APP_DATA: /data
      CONTAINER_ROLE: app
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start migrates and seeds ~16k rows before the web server starts.
      start_period: 600s

  worker:
    <<: *app
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database/database.sqlite
      APP_DATA: /data
      CONTAINER_ROLE: worker
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    depends_on:
      - app

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Isi DOMAIN di .env (nama domain yang menunjuk ke server ini)}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  data:
  caddy_data:
  caddy_config:
