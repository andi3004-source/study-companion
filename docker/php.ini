; Production PHP settings for the app and worker containers.
expose_php = Off
memory_limit = 256M
; "Raba lalu dengar" sends one base64 photo (SCAN_BENDA_MAX_IMAGE_BYTES, 4 MB by default).
post_max_size = 8M
upload_max_filesize = 8M

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
